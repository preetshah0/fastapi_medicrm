version: "3.8"

services:
  app:
    build: .
    container_name: medicrm_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+mysqldb://${DB_USER:-medicrm_user}:${DB_PASSWORD:-medicrm_secret}@db:3306/${DB_NAME:-medicrm}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  
  db:
    image: mysql:8.0
    container_name: medicrm_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-medicrm}
      MYSQL_USER: ${DB_USER:-medicrm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medicrm_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: medicrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

